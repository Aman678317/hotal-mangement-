services:
  - type: web
    name: hostel-management-system
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        fromService:
          type: web
          name: hostel-management-system
          property: host
      - key: ALLOW_SELF_REGISTRATION
        value: "true"
      - key: SEED_DEMO_USERS
        value: "true"
